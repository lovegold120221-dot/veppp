<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beatrice Maps — Google Navigation Test</title>

  <!-- =========================================================
    PASTE YOUR GOOGLE CLOUD MAPS API KEY HERE ONLY
    Required APIs for this test page:
    - Maps JavaScript API
    - Places API
    - Directions API
    - Geocoding API
  ========================================================== -->
  <script>
    const GOOGLE_MAPS_API_KEY = "PASTE_YOUR_GOOGLE_MAPS_API_KEY_HERE";
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #0f172a;
      --muted: #64748b;
      --blue: #1677ff;
      --cyan: #20d6ff;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --panel: rgba(255, 255, 255, 0.94);
      --line: rgba(15, 23, 42, 0.1);
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.22);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dbeafe;
      color: var(--text);
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #dbeafe;
    }

    .overlay-gradient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(2, 6, 23, .48), transparent 22%, transparent 62%, rgba(2, 6, 23, .55)),
        radial-gradient(circle at 20% 10%, rgba(32, 214, 255, .28), transparent 22rem),
        radial-gradient(circle at 92% 16%, rgba(22, 119, 255, .22), transparent 25rem);
      z-index: 2;
    }

    .app-ui {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .top-card,
    .bottom-card,
    .floating-button,
    .message-card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .top-card {
      pointer-events: auto;
      width: min(780px, 100%);
      margin: 0 auto;
      border-radius: 28px;
      padding: 12px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 4px 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      box-shadow: 0 12px 26px rgba(22,119,255,.28);
      font-size: 13px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(22,119,255,.09);
      color: #075fbf;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 18px var(--green);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: .36; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1.16); }
    }

    .route-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
    }

    .inputs {
      display: grid;
      gap: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .pin-dot {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(34,197,94,.13);
      z-index: 2;
    }

    .pin-dot.end {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(239,68,68,.13);
    }

    input {
      width: 100%;
      min-height: 47px;
      border: 1px solid rgba(15,23,42,.1);
      background: #f8fafc;
      color: var(--text);
      border-radius: 17px;
      outline: none;
      padding: 0 14px 0 36px;
      font: inherit;
      font-weight: 750;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    }

    input::placeholder {
      color: #94a3b8;
      font-weight: 650;
    }

    input:focus {
      border-color: rgba(22,119,255,.4);
      box-shadow: 0 0 0 4px rgba(22,119,255,.1);
    }

    .actions {
      display: grid;
      gap: 8px;
      min-width: 126px;
    }

    button {
      appearance: none;
      border: 0;
      min-height: 47px;
      border-radius: 17px;
      padding: 0 14px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform .16s ease, opacity .16s ease, background .16s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .route-btn {
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      box-shadow: 0 12px 28px rgba(22,119,255,.28);
    }

    .ghost-btn {
      color: #14324d;
      background: rgba(15,23,42,.07);
      border: 1px solid rgba(15,23,42,.08);
    }

    .map-controls {
      pointer-events: auto;
      align-self: center;
      justify-self: end;
      display: grid;
      gap: 10px;
      margin-right: 2px;
    }

    .floating-button {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 22px;
      color: #102030;
      padding: 0;
    }

    .bottom-card {
      pointer-events: auto;
      width: min(780px, 100%);
      margin: 0 auto;
      border-radius: 30px;
      overflow: hidden;
      transition: transform .25s ease;
    }

    .handle {
      width: 50px;
      height: 5px;
      border-radius: 999px;
      background: rgba(15,23,42,.18);
      margin: 10px auto 0;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px 16px;
    }

    .eta-row {
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .eta-row strong {
      font-size: clamp(34px, 7vw, 56px);
      line-height: .85;
      letter-spacing: -.08em;
    }

    .eta-row span {
      color: var(--muted);
      font-weight: 850;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
      margin-top: 8px;
    }

    .start-btn {
      min-width: 118px;
      color: white;
      background: #111827;
      box-shadow: 0 12px 28px rgba(17,24,39,.24);
    }

    .steps-panel {
      display: none;
      max-height: 230px;
      overflow: auto;
      border-top: 1px solid var(--line);
      padding: 0 16px 14px;
    }

    .bottom-card.open .steps-panel { display: block; }

    .step-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 11px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(15,23,42,.08);
    }

    .step-icon {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(22,119,255,.1);
      color: var(--blue);
      font-weight: 900;
    }

    .step-row strong {
      display: block;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .step-row small {
      color: var(--muted);
      font-weight: 720;
      line-height: 1.35;
    }

    .step-distance {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .message-card {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      width: min(390px, calc(100% - 30px));
      border-radius: 24px;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
    }

    .message-card strong {
      display: block;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 5px;
    }

    .hidden { display: none !important; }

    .vehicle-marker {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      border: 4px solid white;
      display: grid;
      place-items: center;
      color: white;
      font-size: 18px;
      box-shadow: 0 10px 28px rgba(22,119,255,.42);
    }

    .gm-style .gm-style-iw-c {
      border-radius: 16px !important;
      font-family: Inter, sans-serif !important;
    }

    @media (max-width: 640px) {
      .app-ui {
        padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
      }

      .top-card { border-radius: 24px; padding: 10px; }
      .status { display: none; }
      .route-form { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr 1fr; }
      .map-controls { margin-top: 90px; }
      .floating-button { width: 48px; height: 48px; }
      .summary { grid-template-columns: 1fr; }
      .start-btn { width: 100%; }
      .steps-panel { max-height: 170px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="overlay-gradient"></div>

  <main class="app-ui">
    <section class="top-card">
      <div class="brand-row">
        <div class="brand"><span class="brand-icon">B</span> Beatrice Maps</div>
        <div class="status"><span class="pulse"></span><span id="statusText">Loading Google Maps</span></div>
      </div>

      <div class="route-form">
        <div class="inputs">
          <div class="input-wrap">
            <span class="pin-dot"></span>
            <input id="fromInput" placeholder="Start point, or use my location" autocomplete="off" />
          </div>
          <div class="input-wrap">
            <span class="pin-dot end"></span>
            <input id="toInput" placeholder="Where to?" autocomplete="off" />
          </div>
        </div>
        <div class="actions">
          <button id="routeBtn" class="route-btn" disabled>Route</button>
          <button id="demoBtn" class="ghost-btn" disabled>Demo</button>
        </div>
      </div>
    </section>

    <div class="map-controls">
      <button class="floating-button" id="locateBtn" title="Use my location">⌖</button>
      <button class="floating-button" id="zoomInBtn" title="Zoom in">＋</button>
      <button class="floating-button" id="zoomOutBtn" title="Zoom out">−</button>
    </div>

    <section class="bottom-card" id="bottomCard">
      <div class="handle"></div>
      <div class="summary">
        <div>
          <div class="eta-row"><strong id="etaText">—</strong><span id="arrivalText">Choose a route</span></div>
          <div class="meta-row"><span id="distanceText">No route yet</span><span>·</span><span id="routeText">Google Maps Directions</span></div>
        </div>
        <button class="start-btn" id="startBtn" disabled>Start</button>
      </div>
      <div class="steps-panel" id="stepsPanel"></div>
    </section>
  </main>

  <div class="message-card" id="messageCard">
    <strong>Paste your API key in the head</strong>
    Replace <b>AIzaSyCFgz66f7pN_kh5Jp42A-7pgIWVm4WZ42g</b>, then open this file. Make sure Maps JavaScript, Places, Directions, and Geocoding are enabled.
  </div>

  <script>
    let map;
    let directionsService;
    let directionsRenderer;
    let geocoder;
    let autocompleteFrom;
    let autocompleteTo;
    let currentPosition = null;
    let currentRoute = null;
    let vehicleMarker = null;
    let navigationTimer = null;

    const $ = id => document.getElementById(id);
    const fromInput = $('fromInput');
    const toInput = $('toInput');
    const statusText = $('statusText');
    const messageCard = $('messageCard');
    const bottomCard = $('bottomCard');

    function setStatus(text) {
      statusText.textContent = text;
    }

    function showMessage(title, body) {
      messageCard.innerHTML = `<strong>${title}</strong>${body}`;
      messageCard.classList.remove('hidden');
    }

    function hideMessage() {
      messageCard.classList.add('hidden');
    }

    function loadGoogleMaps() {
      if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY.includes('PASTE_')) {
        setStatus('API key needed');
        showMessage('API key needed', 'Paste your Google Maps API key in the head of this HTML file first.');
        return;
      }

      window.initBeatriceMap = initBeatriceMap;
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&libraries=places&callback=initBeatriceMap`;
      script.async = true;
      script.defer = true;
      script.onerror = () => {
        setStatus('Map failed');
        showMessage('Google Maps failed to load', 'Check your API key, billing, API restrictions, and browser console errors.');
      };
      document.head.appendChild(script);
    }

    function initBeatriceMap() {
      setStatus('Ready');
      hideMessage();

      const defaultCenter = { lat: 50.8503, lng: 4.3517 };

      map = new google.maps.Map(document.getElementById('map'), {
        center: defaultCenter,
        zoom: 13,
        disableDefaultUI: true,
        clickableIcons: false,
        gestureHandling: 'greedy',
        styles: [
          { elementType: 'geometry', stylers: [{ color: '#edf4f7' }] },
          { elementType: 'labels.text.fill', stylers: [{ color: '#34495e' }] },
          { elementType: 'labels.text.stroke', stylers: [{ color: '#ffffff' }] },
          { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#ffffff' }] },
          { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#dbeafe' }] },
          { featureType: 'road.arterial', elementType: 'geometry', stylers: [{ color: '#ffffff' }] },
          { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#bfdbfe' }] },
          { featureType: 'poi', stylers: [{ visibility: 'off' }] },
          { featureType: 'transit', stylers: [{ visibility: 'off' }] }
        ]
      });

      directionsService = new google.maps.DirectionsService();
      geocoder = new google.maps.Geocoder();

      directionsRenderer = new google.maps.DirectionsRenderer({
        map,
        suppressMarkers: false,
        preserveViewport: false,
        polylineOptions: {
          strokeColor: '#1677ff',
          strokeWeight: 7,
          strokeOpacity: 0.96
        }
      });

      autocompleteFrom = new google.maps.places.Autocomplete(fromInput, {
        fields: ['formatted_address', 'geometry', 'name']
      });

      autocompleteTo = new google.maps.places.Autocomplete(toInput, {
        fields: ['formatted_address', 'geometry', 'name']
      });

      $('routeBtn').disabled = false;
      $('demoBtn').disabled = false;

      bindEvents();
    }

    function bindEvents() {
      $('routeBtn').addEventListener('click', buildRoute);
      $('demoBtn').addEventListener('click', runDemo);
      $('locateBtn').addEventListener('click', () => locateUser(true));
      $('zoomInBtn').addEventListener('click', () => map.setZoom(map.getZoom() + 1));
      $('zoomOutBtn').addEventListener('click', () => map.setZoom(map.getZoom() - 1));
      $('startBtn').addEventListener('click', startNavigationSimulation);

      [fromInput, toInput].forEach(input => {
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') buildRoute();
        });
      });

      bottomCard.addEventListener('click', event => {
        if (event.target.closest('button')) return;
        bottomCard.classList.toggle('open');
      });
    }

    function runDemo() {
      fromInput.value = 'Brussels Central Station';
      toInput.value = 'Atomium Brussels';
      buildRoute();
    }

    function locateUser(showToast = true) {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          showMessage('Location unavailable', 'Your browser does not support geolocation. Type a start address instead.');
          reject(new Error('No geolocation support'));
          return;
        }

        setStatus('Locating...');
        navigator.geolocation.getCurrentPosition(position => {
          currentPosition = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          fromInput.value = 'My location';
          map.panTo(currentPosition);
          map.setZoom(15);
          addVehicleMarker(currentPosition);
          setStatus('Location set');
          if (showToast) {
            showMessage('Location ready', 'Your current location is now set as the start point.');
            setTimeout(hideMessage, 1800);
          }
          resolve(currentPosition);
        }, () => {
          setStatus('Location blocked');
          showMessage('Location blocked', 'Allow location permission, or type a start address manually.');
          reject(new Error('Location blocked'));
        }, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        });
      });
    }

    async function getOriginValue() {
      const raw = fromInput.value.trim();
      if (!raw || raw.toLowerCase() === 'my location') {
        if (!currentPosition) await locateUser(false);
        return currentPosition;
      }
      return raw;
    }

    function getDestinationValue() {
      const raw = toInput.value.trim();
      if (!raw) throw new Error('Add a destination first.');
      return raw;
    }

    async function buildRoute() {
      try {
        hideMessage();
        setStatus('Routing...');
        $('routeBtn').disabled = true;

        const origin = await getOriginValue();
        const destination = getDestinationValue();

        directionsService.route({
          origin,
          destination,
          travelMode: google.maps.TravelMode.DRIVING,
          provideRouteAlternatives: true,
          drivingOptions: {
            departureTime: new Date(),
            trafficModel: google.maps.TrafficModel.BEST_GUESS
          }
        }, (result, status) => {
          $('routeBtn').disabled = false;

          if (status !== 'OK' || !result.routes.length) {
            setStatus('Route failed');
            showMessage('Route error', 'Google could not calculate this route. Try a clearer address or destination.');
            return;
          }

          currentRoute = result.routes[0];
          directionsRenderer.setDirections(result);
          directionsRenderer.setRouteIndex(0);
          renderRouteSummary(currentRoute);
          renderSteps(currentRoute);
          setStatus('Route ready');
          hideMessage();
        });
      } catch (error) {
        $('routeBtn').disabled = false;
        setStatus('Needs input');
        showMessage('Route error', error.message || 'Something went wrong.');
      }
    }

    function renderRouteSummary(route) {
      const leg = route.legs[0];
      const duration = leg.duration_in_traffic || leg.duration;
      const arrival = new Date(Date.now() + duration.value * 1000);

      $('etaText').textContent = duration.text;
      $('arrivalText').textContent = 'Arrival ' + arrival.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      $('distanceText').textContent = leg.distance.text;
      $('routeText').textContent = route.summary || 'Fastest route';
      $('startBtn').disabled = false;
      bottomCard.classList.add('open');

      if (leg.start_location) addVehicleMarker(leg.start_location);
    }

    function renderSteps(route) {
      const steps = route.legs.flatMap(leg => leg.steps || []);
      const html = steps.map(step => {
        return `
          <div class="step-row">
            <div class="step-icon">${stepIcon(step.instructions)}</div>
            <div><strong>${stripHtml(step.instructions)}</strong><small>${step.maneuver || 'continue'}</small></div>
            <div class="step-distance">${step.distance.text}</div>
          </div>
        `;
      }).join('');

      $('stepsPanel').innerHTML = html || '<div class="step-row"><div class="step-icon">✓</div><div><strong>Route ready</strong><small>No detailed steps returned.</small></div><div></div></div>';
    }

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      return div.textContent || div.innerText || '';
    }

    function stepIcon(instruction) {
      const text = stripHtml(instruction).toLowerCase();
      if (text.includes('left')) return '↰';
      if (text.includes('right')) return '↱';
      if (text.includes('merge')) return '⇢';
      if (text.includes('roundabout')) return '⟳';
      if (text.includes('destination')) return '✓';
      return '↑';
    }

    function addVehicleMarker(position) {
      if (!map) return;
      if (!vehicleMarker) {
        vehicleMarker = new google.maps.Marker({
          position,
          map,
          icon: {
            path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
            scale: 7,
            fillColor: '#1677ff',
            fillOpacity: 1,
            strokeColor: '#ffffff',
            strokeWeight: 3,
            rotation: 0
          },
          optimized: true
        });
      } else {
        vehicleMarker.setPosition(position);
      }
    }

    function startNavigationSimulation() {
      if (!currentRoute) return;
      const leg = currentRoute.legs[0];
      const path = [];

      leg.steps.forEach(step => {
        step.path.forEach(point => path.push(point));
      });

      if (!path.length) return;

      let index = 0;
      $('startBtn').disabled = true;
      $('startBtn').textContent = 'Navigating';
      setStatus('Navigating');

      if (navigationTimer) clearInterval(navigationTimer);
      navigationTimer = setInterval(() => {
        if (index >= path.length) {
          clearInterval(navigationTimer);
          navigationTimer = null;
          $('etaText').textContent = 'Arrived';
          $('arrivalText').textContent = 'Destination reached';
          setStatus('Arrived');
          return;
        }

        const point = path[index];
        addVehicleMarker(point);
        map.panTo(point);
        index += Math.max(1, Math.floor(path.length / 150));
      }, 260);
    }

    window.addEventListener('load', loadGoogleMaps);
  </script>
</body>
</html>
